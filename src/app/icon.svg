<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- lead/sonar favicon: sonar sweep from the corner, one bright echo. -->
  <defs>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3f8cff"/>
      <stop offset="1" stop-color="#39d4c8"/>
    </linearGradient>
    <radialGradient id="blipGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc24d" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#ffc24d" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffc24d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#141824"/>

  <!-- sweep arcs centred on the bottom-left corner of the tile -->
  <g fill="none" stroke="url(#arc)" stroke-linecap="round">
    <path d="M 12 52 m 10 0 a 10 10 0 0 0 -10 -10" stroke-width="4.5" opacity="0.95"/>
    <path d="M 12 52 m 20 0 a 20 20 0 0 0 -20 -20" stroke-width="4.5" opacity="0.65"/>
    <path d="M 12 52 m 30 0 a 30 30 0 0 0 -30 -30" stroke-width="4.5" opacity="0.38"/>
  </g>

  <!-- sweep line pointing at the echo -->
  <line x1="12" y1="52" x2="41" y2="23" stroke="url(#arc)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

  <!-- the echo: a lead found -->
  <circle cx="45" cy="19" r="13" fill="url(#blipGlow)"/>
  <circle cx="45" cy="19" r="5.5" fill="#ffc24d"/>
  <circle cx="12" cy="52" r="3.5" fill="#39d4c8"/>
</svg>
