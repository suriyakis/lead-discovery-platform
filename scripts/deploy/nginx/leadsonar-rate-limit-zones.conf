# Leadsonar (discover.nulife.pl) — request rate limits at the edge, part 1 of 2.
# PC-38 (I184, X10). Owner-applied on agregat; see docs/DEPLOYMENT.md,
# "Release steps: Phase 1 shared rate limits (PC-38)".
#
# http context: copy to /etc/nginx/conf.d/leadsonar-rate-limit-zones.conf
# (Debian/Ubuntu include conf.d/*.conf inside http {}). Part 2,
# leadsonar-rate-limit.conf, goes inside the discover.nulife.pl server {}.
#
# The app limits its own AI work per workspace (src/lib/rate-limit.ts and
# src/lib/services/action-guards.ts). These limits sit in front of it, per
# client address, and stop what never reaches a workspace: scanners probing
# server actions ("Failed to find Server Action" in the app log) and floods
# against /api/. An empty key is never limited, so each map below picks
# exactly the requests its zone is for.

# /api/ requests, except the endpoints that are called by someone other
# than a signed-in person in a browser, often many times from one address:
#   track             the open pixel, loaded by mail clients and image proxies
#   unsubscribe       one-click unsubscribe (mail providers POST it)
#   stripe/webhook    Stripe's webhook sender
#   health, ready     the container check and the uptime monitor
#   auth              NextAuth (sign-in callbacks, session polling)
# The first matching regex wins, so the exemption comes first.
map $uri $leadsonar_api_key {
    default                                                            "";
    ~^/api/(track|unsubscribe|stripe/webhook|health|ready|auth)(/|$)   "";
    ~^/api/                                                            $binary_remote_addr;
}

# Server actions: a POST to a page with a Next-Action header. Page views,
# RSC navigations and assets carry no such header and are never limited.
map $http_next_action $leadsonar_action_key {
    ""         "";
    default    $binary_remote_addr;
}

# 10 MB of state holds about 160,000 addresses per zone.
limit_req_zone $leadsonar_api_key    zone=leadsonar_api:10m     rate=5r/s;
limit_req_zone $leadsonar_action_key zone=leadsonar_actions:10m rate=2r/s;
