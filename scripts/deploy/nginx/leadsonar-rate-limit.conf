# Leadsonar (discover.nulife.pl) — request rate limits at the edge, part 2 of 2.
# PC-38 (I184, X10). Owner-applied on agregat; see docs/DEPLOYMENT.md,
# "Release steps: Phase 1 shared rate limits (PC-38)".
#
# server context: copy to /etc/nginx/snippets/leadsonar-rate-limit.conf and
# add `include snippets/leadsonar-rate-limit.conf;` inside the
# discover.nulife.pl server {} (the TLS one), above its location blocks.
# Every location without a limit_req of its own inherits these. Needs part
# 1 (leadsonar-rate-limit-zones.conf) in the http context.
#
# Bursts let a person work normally (a page that fires a few API calls, a
# quick series of clicks) and only a sustained flood is refused: past the
# burst a client gets 429 straight away (nodelay) instead of queueing.

limit_req zone=leadsonar_api burst=30 nodelay;
limit_req zone=leadsonar_actions burst=20 nodelay;
limit_req_status 429;
limit_req_log_level warn;
