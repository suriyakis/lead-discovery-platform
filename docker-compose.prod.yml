# Production deployment stack. Runs on agregat (or any Linux host with Docker).
#
# Usage (agregat has docker-compose v1, hyphenated; always both files):
#   scripts/deploy/deploy-agregat.sh          # pull, build, recreate app + worker
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml ps
#   host-side `pnpm db:migrate` for migrations (the image has no tsx)
#
# Reads secrets from .env (POSTGRES_PASSWORD, AUTH_SECRET, GOOGLE_*, OWNER_EMAIL).
# Postgres is NOT exposed to the host network — only the app containers reach it.
# App is exposed only on 127.0.0.1:3001 — nginx reverse proxies from there.
#
# PC-36 (I065): two services run the same image. `app` serves HTTP and only
# enqueues jobs (ROLE=web); `worker` runs the background jobs on two BullMQ
# lanes (ticks / runs) and schedules the ticks (ROLE=worker). Both get the
# same environment except ROLE (src/tests/deploy-compose-pc36.test.ts keeps
# it that way), and both pin JOB_QUEUE_PROVIDER=bullmq: the split needs the
# Redis queue they share, whatever .env says.

services:
  postgres:
    # See base compose: pgvector/pgvector:pg17 is required by Phase 12 (RAG).
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: lead
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
      POSTGRES_DB: lead
    # Bind to loopback only — Hetzner firewall already blocks public 5432 but
    # belt-and-braces. Host port :5433 not :5432 because agregat has another
    # postgres on :5432 (used by an unrelated app); we don't want to fight it.
    # The app container reaches us via docker DNS at postgres:5432, so the
    # host-port choice only matters for host-side `pnpm db:migrate` etc.
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lead -d lead']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Loopback only on the host; the app container reaches it via the
    # docker network alias `redis`.
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      # PC-07: reported by /api/ready (token-protected detail). Export
      # BUILD_SHA=$(git rev-parse --short HEAD) before building.
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
    # PC-36: one tag for both services; the worker runs this image too.
    image: lead-discovery-platform-app:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # PC-36: serve HTTP and enqueue; the worker service runs the jobs.
      ROLE: web
      NODE_ENV: production
      JOB_QUEUE_PROVIDER: bullmq
      # Override DATABASE_URL + REDIS_URL to reach the docker-network
      # service hostnames. The .env's DATABASE_URL/REDIS_URL point at
      # localhost so host-side `pnpm db:migrate` and bullmq inspectors work.
      DATABASE_URL: postgres://lead:${POSTGRES_PASSWORD}@postgres:5432/lead
      REDIS_URL: redis://redis:6379
    # Defined here (not in docker-compose.yml) because compose merges port
    # lists rather than overriding — putting it in both files would publish
    # the container on multiple ports.
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - app-storage:/app/storage

  # PC-36 (I065): the background-job worker. Same image as `app`, its own
  # process: the ticks lane (send-queue drain, inbox sync, probes, crawl
  # engine, sweepers, reaper; concurrency JOB_TICKS_CONCURRENCY, default 4),
  # the batch lane (the long AI ticks: autopilot, follow-ups, health check,
  # compaction; JOB_BATCH_CONCURRENCY, default 3) and the runs lane
  # (discovery runs, knowledge indexing, learning, Re-classify all;
  # JOB_RUNS_CONCURRENCY, default 2), plus the repeatable tick schedule.
  # It serves no HTTP: no `ports:` here, and none in docker-compose.yml
  # either (compose merges port lists). The same storage volume, because
  # knowledge indexing reads uploaded documents. On `docker stop` running
  # jobs get 25 s to finish (src/lib/jobs/worker-process.ts), inside the
  # 30 s grace below.
  worker:
    # The same profile as `app` (docker-compose.yml): the worker depends on
    # redis, which sits in that profile, so it starts exactly like app —
    # when named (`up -d app worker`) or with `--profile app`.
    profiles: ['app']
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
    image: lead-discovery-platform-app:latest
    command: ['node', 'worker/worker.cjs']
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ROLE: worker
      NODE_ENV: production
      JOB_QUEUE_PROVIDER: bullmq
      DATABASE_URL: postgres://lead:${POSTGRES_PASSWORD}@postgres:5432/lead
      REDIS_URL: redis://redis:6379
    volumes:
      - app-storage:/app/storage

volumes:
  postgres-data:
  redis-data:
  app-storage:
